name: Build and publish to Google Play

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Strictly increasing Google Play versionCode"
        required: true
        type: string
      version_name:
        description: "User-visible version, for example 1.0.2"
        required: true
        type: string
      track:
        description: "Google Play release track"
        required: true
        default: "internal"
        type: choice
        options: [internal, beta, production]
      release_status:
        description: "completed, draft, inProgress, or halted"
        required: true
        default: "completed"
        type: choice
        options: [completed, draft, inProgress, halted]
      user_fraction:
        description: "Required only for inProgress production staged rollout, e.g. 0.1"
        required: false
        type: string
      publish:
        description: "Publish to Google Play after build; false only validates the build"
        required: true
        default: true
        type: boolean
      validate_only:
        description: "Ask Google Play to validate the upload without committing it"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-22.04
    # Protect production with manual reviewers configured in GitHub Environments.
    environment: ${{ inputs.track == 'production' && 'google-play-production' || 'google-play' }}
    env:
      RELEASE_VERSION_CODE: ${{ inputs.version_code }}
      RELEASE_VERSION_NAME: ${{ inputs.version_name }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
      PLAY_TRACK: ${{ inputs.track }}
      PLAY_RELEASE_STATUS: ${{ inputs.release_status }}
      PLAY_USER_FRACTION: ${{ inputs.user_fraction }}
      PLAY_VALIDATE_ONLY: ${{ inputs.validate_only }}
      PLAY_PRODUCTION_APPROVED: ${{ inputs.track == 'production' && 'yes' || '' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build signed Android App Bundle
        run: bash scripts/build-release.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: shufa-${{ inputs.version_name }}-${{ inputs.version_code }}.aab
          path: dist/*.aab
          if-no-files-found: error
      - name: Upload to Google Play
        if: ${{ inputs.publish }}
        run: bash scripts/publish-play.sh
